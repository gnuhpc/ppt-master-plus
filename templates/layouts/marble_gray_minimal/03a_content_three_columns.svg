<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1280" height="720" viewBox="0 0 1280 720">
  <image href="marble_bg.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="none" />
  
  <!-- Top Left Gold Badge decoration -->
  <g id="shape-5" data-name="组合 4">
    <g id="shape-3" data-name="矩形: 圆角 2">
      <rect x="81.88" y="62.12" width="42.35" height="42.35" rx="7.06" ry="7.06" fill="#F2F2F2" stroke="none" stroke-width="1" />
    </g>
    <g id="shape-31" data-name="矩形: 圆角 30">
      <rect x="67.76" y="50.82" width="42.35" height="42.35" rx="7.06" ry="7.06" fill="none" stroke-width="4" stroke="#C1A36C" />
    </g>
  </g>
  
  <!-- Page Title -->
  <g id="shape-6" data-name="TextBox 7">
    <rect x="138.35" y="48.72" width="277.89" height="61.39" fill="none" />
    <text x="147.95" y="89.79" text-anchor="start" xml:space="preserve" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="42.67" fill="#262626">{{PAGE_TITLE}}</text>
  </g>
  
  <!-- Card 1 -->
  <g id="card-1">
    <rect x="100" y="220" width="320" height="380" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" rx="8" ry="8" />
    <!-- Gold Ribbon/Tab -->
    <rect x="230" y="195" width="60" height="50" rx="4" ry="4" fill="#C1A36C" />
    <circle cx="260" cy="220" r="12" fill="#FFFFFF" />
    <text x="260" y="225" font-family="sans-serif" font-size="14" font-weight="bold" fill="#C1A36C" text-anchor="middle">01</text>
    
    <text x="260" y="290" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1E293B" text-anchor="middle">{{CARD_1_TITLE}}</text>
    <text x="260" y="340" font-family="sans-serif" font-size="15" fill="#475569" text-anchor="middle">
      <tspan x="260" dy="0">{{CARD_1_BODY_L1}}</tspan>
      <tspan x="260" dy="24">{{CARD_1_BODY_L2}}</tspan>
      <tspan x="260" dy="24">{{CARD_1_BODY_L3}}</tspan>
    </text>
  </g>
  
  <!-- Card 2 -->
  <g id="card-2">
    <rect x="480" y="220" width="320" height="380" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" rx="8" ry="8" />
    <!-- Gold Ribbon/Tab -->
    <rect x="610" y="195" width="60" height="50" rx="4" ry="4" fill="#C1A36C" />
    <circle cx="640" cy="220" r="12" fill="#FFFFFF" />
    <text x="640" y="225" font-family="sans-serif" font-size="14" font-weight="bold" fill="#C1A36C" text-anchor="middle">02</text>
    
    <text x="640" y="290" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1E293B" text-anchor="middle">{{CARD_2_TITLE}}</text>
    <text x="640" y="340" font-family="sans-serif" font-size="15" fill="#475569" text-anchor="middle">
      <tspan x="640" dy="0">{{CARD_2_BODY_L1}}</tspan>
      <tspan x="640" dy="24">{{CARD_2_BODY_L2}}</tspan>
      <tspan x="640" dy="24">{{CARD_2_BODY_L3}}</tspan>
    </text>
  </g>
  
  <!-- Card 3 -->
  <g id="card-3">
    <rect x="860" y="220" width="320" height="380" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" rx="8" ry="8" />
    <!-- Gold Ribbon/Tab -->
    <rect x="990" y="195" width="60" height="50" rx="4" ry="4" fill="#C1A36C" />
    <circle cx="1020" cy="220" r="12" fill="#FFFFFF" />
    <text x="1020" y="225" font-family="sans-serif" font-size="14" font-weight="bold" fill="#C1A36C" text-anchor="middle">03</text>
    
    <text x="1020" y="290" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1E293B" text-anchor="middle">{{CARD_3_TITLE}}</text>
    <text x="1020" y="340" font-family="sans-serif" font-size="15" fill="#475569" text-anchor="middle">
      <tspan x="1020" dy="0">{{CARD_3_BODY_L1}}</tspan>
      <tspan x="1020" dy="24">{{CARD_3_BODY_L2}}</tspan>
      <tspan x="1020" dy="24">{{CARD_3_BODY_L3}}</tspan>
    </text>
  </g>
  
  <!-- Footer Page Number -->
  <text x="640" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7F7F7F">{{PAGE_NUM}}</text>
</svg>
