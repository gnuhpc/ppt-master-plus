<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
  
  <!-- Bottom dots decoration -->
  <g id="shape-27" data-name="组合 26">
    <ellipse cx="611.39" cy="664.73" rx="7.27" ry="7.27" fill="#262626" />
    <ellipse cx="640" cy="664.73" rx="7.27" ry="7.27" fill="#262626" />
    <ellipse cx="668.61" cy="664.73" rx="7.27" ry="7.27" fill="#262626" />
  </g>
  
  <!-- Top Badge decoration -->
  <g id="shape-28" data-name="组合 27">
    <line x1="461.09" y1="97.17" x2="503.76" y2="97.17" stroke-width="2" stroke="#000000" />
    <line x1="771.39" y1="97.17" x2="814.06" y2="97.17" stroke-width="2" stroke="#000000" />
  </g>
  <g id="shape-26" data-name="文本框 25">
    <rect x="487.27" y="82.62" width="305.45" height="29.08" fill="none" />
    <text x="640" y="101.02" text-anchor="middle" font-family="'Georgia', serif" font-size="16" fill="#000000" letter-spacing="4">WE LOVE WHAT WE DO</text>
  </g>
  
  <!-- Page Title & Divider -->
  <text x="80" y="140" text-anchor="start" font-family="'Georgia', serif" font-size="28" font-weight="bold" fill="#262626">{{PAGE_TITLE}}</text>
  <line x1="80" y1="160" x2="1200" y2="160" stroke="#D9D9D9" stroke-width="1" />
  
  <!-- Left Side Image Placeholder (Editorial overlap effect) -->
  <g id="image-frame">
    <rect x="80" y="190" width="420" height="430" fill="none" stroke="#262626" stroke-width="2" />
    <rect x="110" y="220" width="420" height="430" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
    <text x="320" y="445" font-family="sans-serif" font-size="16" fill="#64748B" text-anchor="middle">EDITORIAL PORTRAIT IMAGE</text>
  </g>
  
  <!-- Right Side Split Layout Content -->
  <g id="text-content">
    <text x="590" y="270" font-family="'Georgia', serif" font-size="54" font-weight="bold" fill="#0F172A">{{SUBTITLE_HERO}}</text>
    <text x="590" y="340" font-family="sans-serif" font-size="16" fill="#334155" width="600">
      <tspan x="590" dy="0">{{BODY_TEXT_L1}}</tspan>
      <tspan x="590" dy="28">{{BODY_TEXT_L2}}</tspan>
      <tspan x="590" dy="28">{{BODY_TEXT_L3}}</tspan>
      <tspan x="590" dy="28">{{BODY_TEXT_L4}}</tspan>
    </text>
  </g>
  
  <!-- Footer Page Number -->
  <text x="640" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7F7F7F">{{PAGE_NUM}}</text>
</svg>
