<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Background -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
  
  <!-- Header Chrome -->
  <g id="header-chrome" fill="#A3A3A3" font-family="'Inter', sans-serif">
    <text x="80" y="60" font-weight="600" font-size="14" letter-spacing="1">KPI TOWER // S06</text>
    <line x1="80" y1="80" x2="1200" y2="80" stroke="#E0E0E0" stroke-width="1" />
  </g>

  <!-- Page Title -->
  <g id="title-block">
    <text x="80" y="140" font-family="'Inter', sans-serif" font-weight="200" font-size="44" fill="#0A0A0A">{{PAGE_TITLE}}</text>
  </g>

  <!-- Tower Column 1 (Small) -->
  <g id="tower-1">
    <!-- Outer background shape -->
    <rect x="180" y="380" width="260" height="220" fill="#F5F5F5" />
    <line x1="180" y1="380" x2="440" y2="380" stroke="#0020C2" stroke-width="2" />
    <!-- KPI Number (Large JetBrains Mono) -->
    <text x="210" y="450" font-family="'JetBrains Mono', monospace" font-weight="300" font-size="54" fill="#0A0A0A">{{VAL_1}}</text>
    <text x="210" y="520" font-family="'Inter', sans-serif" font-weight="500" font-size="18" fill="#4B4B4B">{{LABEL_1}}</text>
  </g>

  <!-- Tower Column 2 (Medium) -->
  <g id="tower-2">
    <rect x="510" y="280" width="260" height="320" fill="#F5F5F5" />
    <line x1="510" y1="280" x2="770" y2="280" stroke="#0020C2" stroke-width="2" />
    <text x="540" y="350" font-family="'JetBrains Mono', monospace" font-weight="300" font-size="54" fill="#0A0A0A">{{VAL_2}}</text>
    <text x="540" y="420" font-family="'Inter', sans-serif" font-weight="500" font-size="18" fill="#4B4B4B">{{LABEL_2}}</text>
  </g>

  <!-- Tower Column 3 (Large/Accent Hero) -->
  <g id="tower-3">
    <!-- This is the highlighted tower column in Klein Blue tint background -->
    <rect x="840" y="180" width="260" height="420" fill="#E0E4FC" />
    <line x1="840" y1="180" x2="1100" y2="180" stroke="#0020C2" stroke-width="3" />
    <text x="870" y="260" font-family="'JetBrains Mono', monospace" font-weight="300" font-size="64" fill="#0020C2">{{VAL_3}}</text>
    <text x="870" y="330" font-family="'Inter', sans-serif" font-weight="600" font-size="18" fill="#0A0A0A">{{LABEL_3}}</text>
  </g>

  <!-- Footer -->
  <g id="footer-block">
    <line x1="80" y1="640" x2="1200" y2="640" stroke="#E0E0E0" stroke-width="1" />
    <text x="80" y="670" font-family="'JetBrains Mono', monospace" font-size="12" fill="#A3A3A3">SWISS METRIC SYSTEM</text>
  </g>
</svg>
