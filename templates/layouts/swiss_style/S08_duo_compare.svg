<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Background -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
  
  <!-- Header Chrome -->
  <g id="header-chrome" fill="#A3A3A3" font-family="'Inter', sans-serif">
    <text x="80" y="60" font-weight="600" font-size="14" letter-spacing="1">DIVERGENCE // S08</text>
    <line x1="80" y1="80" x2="1200" y2="80" stroke="#E0E0E0" stroke-width="1" />
  </g>

  <!-- Page Title -->
  <g id="title-block">
    <text x="80" y="140" font-family="'Inter', sans-serif" font-weight="200" font-size="44" fill="#0A0A0A">{{PAGE_TITLE}}</text>
  </g>

  <!-- Vertical Divider Hairline -->
  <line x1="640" y1="200" x2="640" y2="600" stroke="#0020C2" stroke-width="1.5" />

  <!-- Left Column: Before / Challenge -->
  <g id="before-block">
    <text x="80" y="240" font-family="'Inter', sans-serif" font-weight="500" font-size="28" fill="#4B4B4B">{{BEFORE_TITLE}}</text>
    <rect x="80" y="270" width="500" height="320" fill="none" />
    <text x="80" y="300" font-family="'Inter', sans-serif" font-weight="300" font-size="18" fill="#5C5C5C" line-height="1.5">{{BEFORE_BODY}}</text>
  </g>

  <!-- Right Column: After / Solution (Accent Color highlights) -->
  <g id="after-block">
    <text x="690" y="240" font-family="'Inter', sans-serif" font-weight="600" font-size="28" fill="#0020C2">{{AFTER_TITLE}}</text>
    <rect x="690" y="270" width="500" height="320" fill="none" />
    <text x="690" y="300" font-family="'Inter', sans-serif" font-weight="300" font-size="18" fill="#0A0A0A" line-height="1.5">{{AFTER_BODY}}</text>
  </g>

  <!-- Footer -->
  <g id="footer-block">
    <line x1="80" y1="640" x2="1200" y2="640" stroke="#E0E0E0" stroke-width="1" />
    <text x="80" y="670" font-family="'JetBrains Mono', monospace" font-size="12" fill="#A3A3A3">SWISS CONTRAST MATRIX</text>
  </g>
</svg>
