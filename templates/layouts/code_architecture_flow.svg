<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-control-items="3" data-control-variant="flow">
  <rect width="1280" height="720" fill="#0F172A"/>
  <text x="80" y="80" font-family="Consolas, Fira Code, monospace" font-size="32" font-weight="bold" fill="#38BDF8">$ system_architecture --flow</text>
  <text x="80" y="115" font-family="Consolas, monospace" font-size="16" fill="#94A3B8">// Code Terminal 3-Step Execution Pipeline</text>

  <!-- Step 1 -->
  <g id="card-1" data-control-index="1">
    <rect x="80" y="160" width="340" height="460" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <circle cx="110" cy="190" r="6" fill="#EF4444"/>
    <circle cx="130" cy="190" r="6" fill="#F59E0B"/>
    <circle cx="150" cy="190" r="6" fill="#10B981"/>
    <text x="110" y="240" font-family="Consolas, monospace" font-size="20" font-weight="bold" fill="#22C55E">01. Ingestion Layer</text>
    <text x="110" y="285" font-family="PingFang SC, sans-serif" font-size="15" fill="#E2E8F0">多源数据解析与特征提取</text>
    <text x="110" y="325" font-family="Consolas, monospace" font-size="13" fill="#94A3B8">&gt; parse_input(raw_stream)</text>
    <text x="110" y="350" font-family="Consolas, monospace" font-size="13" fill="#94A3B8">&gt; validate_schema()</text>
  </g>

  <!-- Step 2 -->
  <g id="card-2" data-control-index="2">
    <rect x="470" y="160" width="340" height="460" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="500" cy="190" r="6" fill="#EF4444"/>
    <circle cx="520" cy="190" r="6" fill="#F59E0B"/>
    <circle cx="540" cy="190" r="6" fill="#10B981"/>
    <text x="500" y="240" font-family="Consolas, monospace" font-size="20" font-weight="bold" fill="#38BDF8">02. Reasoning Engine</text>
    <text x="500" y="285" font-family="PingFang SC, sans-serif" font-size="15" fill="#E2E8F0">大模型推理与上下文编排</text>
    <text x="500" y="325" font-family="Consolas, monospace" font-size="13" fill="#94A3B8">&gt; agent.plan(task_spec)</text>
    <text x="500" y="350" font-family="Consolas, monospace" font-size="13" fill="#94A3B8">&gt; invoke_subagents()</text>
  </g>

  <!-- Step 3 -->
  <g id="card-3" data-control-index="3">
    <rect x="860" y="160" width="340" height="460" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <circle cx="890" cy="190" r="6" fill="#EF4444"/>
    <circle cx="910" cy="190" r="6" fill="#F59E0B"/>
    <circle cx="930" cy="190" r="6" fill="#10B981"/>
    <text x="890" y="240" font-family="Consolas, monospace" font-size="20" font-weight="bold" fill="#22C55E">03. Synthesis &amp; Export</text>
    <text x="890" y="285" font-family="PingFang SC, sans-serif" font-size="15" fill="#E2E8F0">矢量渲染与 OOXML 导出</text>
    <text x="890" y="325" font-family="Consolas, monospace" font-size="13" fill="#94A3B8">&gt; svg_render(clean_tree)</text>
    <text x="890" y="350" font-family="Consolas, monospace" font-size="13" fill="#94A3B8">&gt; export_to_pptx()</text>
  </g>
</svg>
