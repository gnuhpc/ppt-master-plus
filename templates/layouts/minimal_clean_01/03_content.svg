<text x="115.3" y="153.6" text-anchor="start" xml:space="preserve" font-family="&quot;Calibri Light&quot;, +mn-cs, sans-serif" font-size="21.33" fill="#808080"><tspan fill="#808080" font-size="21.33">Just for today I will exercise my soul in three ways. I will do somebody a good turn and not get found </tspan><tspan x="115.3" dy="21.33" fill="#808080" font-size="21.33">out: If anybody knows of it, it will not count. I will do at least two things I don‘t want to do—just for </tspan><tspan x="115.3" dy="21.33" fill="#808080" font-size="21.33">exercise. I will not show anyone that my feelings are hurt: they may be hurt, but today I will not </tspan><tspan x="115.3" dy="21.33" fill="#808080" font-size="21.33">show it.</tspan></text>
</g>
