<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="txtgrad1" x1="0.25" y1="0.0" x2="0.25" y2="0.5">
      <stop offset="0.15" stop-color="#9966F7" />
      <stop offset="0.75" stop-color="#9966F7" stop-opacity="0" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="1280" height="720" fill="#000000" />
  <g id="layout-shape-4" transform="translate(640.0 360.0) scale(-1 1) translate(-640.0 -360.0)">
    <image href="chapter_bg.jpeg" x="0" y="0" width="1280" height="720" preserveAspectRatio="none" />
  </g>
  
  <!-- Logo -->
  <image href="logo.png" x="33.165" y="26.635" width="99.41" height="48.145" preserveAspectRatio="none" />

  <!-- Chapter Number -->
  <g id="chapter-num-group">
    <text x="640" y="270" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-size="106.6" fill="url(#txtgrad1)" font-weight="bold">{{CHAPTER_NUM}}</text>
  </g>

  <!-- Chapter Title -->
  <g id="chapter-title-group">
    <text x="640" y="360" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="44" fill="#FFFFFF" font-weight="bold">{{CHAPTER_TITLE}}</text>
    
    <rect x="613.2" y="401.585" width="53.595" height="4.69" fill="#9966F7" stroke="none" />
    
    <!-- Chapter Desc -->
    <text x="640" y="445" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#D9D9D9">{{CHAPTER_DESC}}</text>
  </g>
</svg>
