<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="ggrad1" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="1280" height="720" fill="#000000" />
  <image href="content_bg.jpeg" x="0" y="0" width="1280" height="720" preserveAspectRatio="none" />
  
  <!-- Logo -->
  <image href="logo.png" x="33.165" y="26.635" width="99.41" height="48.145" preserveAspectRatio="none" />

  <!-- Page Title -->
  <text x="640" y="116" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="32" fill="#FFFFFF" font-weight="bold">{{PAGE_TITLE}}</text>
  
  <!-- Key Message -->
  <text x="640" y="153" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#D9D9D9">{{KEY_MESSAGE}}</text>

  <!-- Content Box Container -->
  <rect x="99.5" y="180" width="1081" height="443" rx="8" fill="url(#ggrad1)" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="4,4" />
  
  <!-- Content Area Placeholder -->
  <text x="640" y="400" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#666666">
    {{CONTENT_AREA}}
  </text>

  <!-- Footer Info -->
  <text x="100" y="690" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#666666">{{SECTION_NAME}}</text>
  <text x="640" y="690" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-size="12" fill="#666666">{{PAGE_NUM}}</text>
  <text x="1180" y="690" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#666666">{{SOURCE}}</text>
</svg>
