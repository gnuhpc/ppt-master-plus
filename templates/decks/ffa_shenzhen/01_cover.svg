<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="ggrad1" x1="0.5" y1="0.25" x2="0.0" y2="0.25">
      <stop offset="0.49" stop-color="#9966F7" stop-opacity="0.5" />
      <stop offset="0" stop-color="#9966F7" stop-opacity="0" />
      <stop offset="1" stop-color="#9966F7" stop-opacity="0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="1280" height="720" fill="#000000" />
  <image href="cover_bg.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="none" />
  
  <!-- Logo -->
  <image href="logo.png" x="33.165" y="26.635" width="99.41" height="48.145" preserveAspectRatio="none" />
  <image href="sponsor_logo.png" x="59.88" y="582.67" width="151.93" height="64.58" preserveAspectRatio="none" />

  <!-- Title & Subtitle Group -->
  <g id="title-group">
    <!-- Main Title -->
    <text x="61.135" y="240" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="48" fill="#FFFFFF" font-weight="bold">{{TITLE}}</text>
    
    <!-- Subtitle -->
    <text x="61.135" y="320" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#D9D9D9">{{SUBTITLE}}</text>
  </g>

  <!-- Presenter & Info Group -->
  <g id="presenter-group">
    <rect x="69.105" y="405.96" width="462.705" height="56.085" fill="url(#ggrad1)" stroke="none" />
    <rect x="63.42" y="405.96" width="3.115" height="56.085" fill="#9967F7" stroke="none" />
    <rect x="190.795" y="421.54" width="1.87" height="24.925" fill="#FFFFFF" stroke="none" />
    
    <!-- Author -->
    <text x="85.03" y="442" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" fill="#FFFFFF">{{AUTHOR}}</text>
    
    <!-- Date / Tagline -->
    <text x="207.455" y="440" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#D9D9D9">{{DATE}}</text>
  </g>
</svg>
