<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F8FAFC" />
  <text x="640" y="100" font-family="sans-serif" font-size="36" font-weight="bold" fill="#1E293B" text-anchor="middle">{{PAGE_TITLE}}</text>

  <!-- Connecting Lines -->
  <line x1="260" y1="360" x2="440" y2="360" stroke="#CBD5E1" stroke-width="3" />
  <line x1="620" y1="360" x2="800" y2="360" stroke="#CBD5E1" stroke-width="3" />
  <line x1="980" y1="360" x2="1020" y2="360" stroke="#CBD5E1" stroke-width="3" />

  <!-- Circle 1 -->
  <circle cx="160" cy="360" r="100" fill="#E2E8F0" stroke="none" />
  <circle cx="160" cy="360" r="100" fill="#334155" stroke="none" />
  <text x="160" y="345" font-family="sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">ICON</text>
  <text x="160" y="370" font-family="sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ITEM 1</text>
  <text x="160" y="250" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1E293B" text-anchor="middle">Above Label 1</text>
  <text x="160" y="480" font-family="sans-serif" font-size="14" fill="#64748B" text-anchor="middle">Below text one</text>

  <!-- Circle 2 -->
  <circle cx="520" cy="360" r="100" fill="#1E3A5F" stroke="none" />
  <text x="520" y="345" font-family="sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">ICON</text>
  <text x="520" y="370" font-family="sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ITEM 2</text>
  <text x="520" y="250" font-family="sans-serif" font-size="18" font-weight="bold" fill="#3B82F6" text-anchor="middle">Above Label 2</text>
  <text x="520" y="480" font-family="sans-serif" font-size="14" fill="#64748B" text-anchor="middle">Below text two</text>

  <!-- Circle 3 -->
  <circle cx="880" cy="360" r="100" fill="#334155" stroke="none" />
  <text x="880" y="345" font-family="sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">ICON</text>
  <text x="880" y="370" font-family="sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ITEM 3</text>
  <text x="880" y="250" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1E293B" text-anchor="middle">Above Label 3</text>
  <text x="880" y="480" font-family="sans-serif" font-size="14" fill="#64748B" text-anchor="middle">Below text three</text>

  <!-- Circle 4 -->
  <circle cx="1120" cy="360" r="100" fill="#1E3A5F" stroke="none" />
  <text x="1120" y="345" font-family="sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">ICON</text>
  <text x="1120" y="370" font-family="sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ITEM 4</text>
  <text x="1120" y="250" font-family="sans-serif" font-size="18" font-weight="bold" fill="#3B82F6" text-anchor="middle">Above Label 4</text>
  <text x="1120" y="480" font-family="sans-serif" font-size="14" fill="#64748B" text-anchor="middle">Below text four</text>
