<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  <!-- Right: full-height image placeholder -->
  <rect x="700" y="0" width="580" height="720" fill="#E2E8F0" />
  <text x="990" y="370" font-family="sans-serif" font-size="18" fill="#94A3B8" text-anchor="middle">FULL HEIGHT IMAGE</text>

  <!-- Left: Title + 3 bullets -->
  <text x="80" y="160" font-family="sans-serif" font-size="42" font-weight="bold" fill="#1E293B">{{PAGE_TITLE}}</text>
  <line x1="80" y1="185" x2="240" y2="185" stroke="#3B82F6" stroke-width="4" />

  <g transform="translate(80, 250)">
    <!-- Bullet 1 -->
    <rect x="0" y="0" width="560" height="100" fill="#F8FAFC" rx="8" />
    <text x="30" y="38" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1E293B">Point One</text>
    <text x="30" y="68" font-family="sans-serif" font-size="15" fill="#64748B">Description explaining the first key insight here.</text>

    <!-- Bullet 2 -->
    <rect x="0" y="120" width="560" height="100" fill="#F8FAFC" rx="8" />
    <text x="30" y="158" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1E293B">Point Two</text>
    <text x="30" y="188" font-family="sans-serif" font-size="15" fill="#64748B">Description explaining the second key insight here.</text>

    <!-- Bullet 3 -->
    <rect x="0" y="240" width="560" height="100" fill="#F8FAFC" rx="8" />
    <text x="30" y="278" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1E293B">Point Three</text>
    <text x="30" y="308" font-family="sans-serif" font-size="15" fill="#64748B">Description explaining the third key insight here.</text>
  </g>
</svg>
