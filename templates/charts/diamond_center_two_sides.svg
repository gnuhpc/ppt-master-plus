<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#1E293B" />

  <!-- Inverted triangle (dark background accent) -->
  <polygon points="640,40 1080,450 200,450" fill="#0F172A" />

  <!-- Title area -->
  <text x="640" y="120" font-family="sans-serif" font-size="40" font-weight="bold" fill="#FFFFFF" text-anchor="middle">{{PAGE_TITLE}}</text>
  <line x1="500" y1="145" x2="780" y2="145" stroke="#3B82F6" stroke-width="3" />
  <text x="640" y="185" font-family="sans-serif" font-size="16" fill="#94A3B8" text-anchor="middle">Subtitle or supporting description</text>

  <!-- Diamond center shape (image placeholder) -->
  <polygon points="640,280 760,400 640,520 520,400" fill="#334155" stroke="#64748B" stroke-width="2" />
  <text x="640" y="408" font-family="sans-serif" font-size="16" fill="#94A3B8" text-anchor="middle">IMAGE</text>

  <!-- Left connector line -->
  <line x1="505" y1="400" x2="440" y2="400" stroke="#475569" stroke-width="1" />

  <!-- Left text -->
  <text x="420" y="385" font-family="sans-serif" font-size="20" font-weight="bold" fill="#F8FAFC" text-anchor="end">Left Point Title</text>
  <text x="420" y="415" font-family="sans-serif" font-size="14" fill="#94A3B8" text-anchor="end">
    <tspan x="420" dy="0">Explanatory text for left</tspan>
    <tspan x="420" dy="20">point goes here.</tspan>
  </text>

  <!-- Right connector line -->
  <line x1="775" y1="400" x2="840" y2="400" stroke="#475569" stroke-width="1" />

  <!-- Right text -->
  <text x="860" y="385" font-family="sans-serif" font-size="20" font-weight="bold" fill="#F8FAFC">Right Point Title</text>
  <text x="860" y="415" font-family="sans-serif" font-size="14" fill="#94A3B8">
    <tspan x="860" dy="0">Explanatory text for right</tspan>
    <tspan x="860" dy="20">point goes here.</tspan>
  </text>
</svg>
