<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#0F172A" />
  
  <text x="640" y="120" font-family="sans-serif" font-size="36" font-weight="bold" fill="#FFFFFF" text-anchor="middle">{{PAGE_TITLE}}</text>
  
  <g transform="translate(200, 300)">
    <!-- Indicator 1 -->
    <g transform="translate(0, 0)">
      <!-- Outer Circle -->
      <circle cx="90" cy="90" r="80" fill="none" stroke="#1E293B" stroke-width="16" />
      <!-- Progress Circle (fake) -->
      <path d="M 90 10 A 80 80 0 0 1 170 90" fill="none" stroke="#38BDF8" stroke-width="16" stroke-linecap="round" />
      
      <text x="90" y="100" font-family="sans-serif" font-size="40" font-weight="bold" fill="#FFFFFF" text-anchor="middle">25%</text>
      <text x="90" y="210" font-family="sans-serif" font-size="22" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Metric One</text>
      <text x="90" y="240" font-family="sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">Description of metric</text>
    </g>
    
    <!-- Indicator 2 -->
    <g transform="translate(350, 0)">
      <!-- Outer Circle -->
      <circle cx="90" cy="90" r="80" fill="none" stroke="#1E293B" stroke-width="16" />
      <!-- Progress Circle -->
      <path d="M 90 10 A 80 80 0 1 1 33 146" fill="none" stroke="#38BDF8" stroke-width="16" stroke-linecap="round" />
      
      <text x="90" y="100" font-family="sans-serif" font-size="40" font-weight="bold" fill="#FFFFFF" text-anchor="middle">75%</text>
      <text x="90" y="210" font-family="sans-serif" font-size="22" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Metric Two</text>
      <text x="90" y="240" font-family="sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">Description of metric</text>
    </g>
    
    <!-- Indicator 3 -->
    <g transform="translate(700, 0)">
      <!-- Outer Circle -->
      <circle cx="90" cy="90" r="80" fill="none" stroke="#1E293B" stroke-width="16" />
      <!-- Progress Circle -->
      <path d="M 90 10 A 80 80 0 0 1 90 170" fill="none" stroke="#38BDF8" stroke-width="16" stroke-linecap="round" />
      
      <text x="90" y="100" font-family="sans-serif" font-size="40" font-weight="bold" fill="#FFFFFF" text-anchor="middle">50%</text>
      <text x="90" y="210" font-family="sans-serif" font-size="22" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Metric Three</text>
      <text x="90" y="240" font-family="sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">Description of metric</text>
    </g>
