<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
  
  <text x="640" y="100" font-family="sans-serif" font-size="36" font-weight="bold" fill="#333333" text-anchor="middle">{{PAGE_TITLE}}</text>
  
  <g transform="translate(140, 300)">
    <!-- Connecting Line -->
    <line x1="100" y1="50" x2="900" y2="50" stroke="#E2E8F0" stroke-width="4" />
    
    <!-- Step 1 -->
    <g transform="translate(100, 50)">
      <circle cx="0" cy="0" r="24" fill="#3B82F6" />
      <text x="0" y="8" font-family="sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">01</text>
      <text x="0" y="50" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1E293B" text-anchor="middle">Step 1 Title</text>
      <text x="0" y="80" font-family="sans-serif" font-size="14" fill="#64748B" text-anchor="middle">
        <tspan x="0" dy="0">Description line 1</tspan>
        <tspan x="0" dy="20">Description line 2</tspan>
      </text>
    </g>
    
    <!-- Step 2 -->
    <g transform="translate(366, 50)">
      <circle cx="0" cy="0" r="24" fill="#3B82F6" />
      <text x="0" y="8" font-family="sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">02</text>
      <text x="0" y="50" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1E293B" text-anchor="middle">Step 2 Title</text>
      <text x="0" y="80" font-family="sans-serif" font-size="14" fill="#64748B" text-anchor="middle">
        <tspan x="0" dy="0">Description line 1</tspan>
        <tspan x="0" dy="20">Description line 2</tspan>
      </text>
    </g>
    
    <!-- Step 3 -->
    <g transform="translate(633, 50)">
      <circle cx="0" cy="0" r="24" fill="#3B82F6" />
      <text x="0" y="8" font-family="sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">03</text>
      <text x="0" y="50" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1E293B" text-anchor="middle">Step 3 Title</text>
      <text x="0" y="80" font-family="sans-serif" font-size="14" fill="#64748B" text-anchor="middle">
        <tspan x="0" dy="0">Description line 1</tspan>
        <tspan x="0" dy="20">Description line 2</tspan>
      </text>
    </g>
    
    <!-- Step 4 -->
    <g transform="translate(900, 50)">
      <circle cx="0" cy="0" r="24" fill="#3B82F6" />
      <text x="0" y="8" font-family="sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">04</text>
      <text x="0" y="50" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1E293B" text-anchor="middle">Step 4 Title</text>
      <text x="0" y="80" font-family="sans-serif" font-size="14" fill="#64748B" text-anchor="middle">
        <tspan x="0" dy="0">Description line 1</tspan>
        <tspan x="0" dy="20">Description line 2</tspan>
      </text>
    </g>
  </g>
</svg>
