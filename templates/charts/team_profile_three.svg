<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
  
  <text x="640" y="120" font-family="sans-serif" font-size="36" font-weight="bold" fill="#1E293B" text-anchor="middle">{{PAGE_TITLE}}</text>
  
  <g transform="translate(190, 240)">
    <!-- Member 1 -->
    <g transform="translate(0, 0)">
      <circle cx="150" cy="100" r="100" fill="#E2E8F0" />
      <text x="150" y="105" font-family="sans-serif" font-size="16" fill="#94A3B8" text-anchor="middle">PHOTO</text>
      
      <text x="150" y="240" font-family="sans-serif" font-size="24" font-weight="bold" fill="#0F172A" text-anchor="middle">Name Surname</text>
      <text x="150" y="270" font-family="sans-serif" font-size="18" fill="#3B82F6" text-anchor="middle">CEO / Founder</text>
      <text x="150" y="310" font-family="sans-serif" font-size="14" fill="#64748B" text-anchor="middle">
        <tspan x="150" dy="0">15+ years of experience</tspan>
        <tspan x="150" dy="20">in tech industry leadership.</tspan>
      </text>
    </g>
    
    <!-- Member 2 -->
    <g transform="translate(300, 0)">
      <circle cx="150" cy="100" r="100" fill="#E2E8F0" />
      <text x="150" y="105" font-family="sans-serif" font-size="16" fill="#94A3B8" text-anchor="middle">PHOTO</text>
      
      <text x="150" y="240" font-family="sans-serif" font-size="24" font-weight="bold" fill="#0F172A" text-anchor="middle">Name Surname</text>
      <text x="150" y="270" font-family="sans-serif" font-size="18" fill="#3B82F6" text-anchor="middle">CTO</text>
      <text x="150" y="310" font-family="sans-serif" font-size="14" fill="#64748B" text-anchor="middle">
        <tspan x="150" dy="0">Expert in scalable systems</tspan>
        <tspan x="150" dy="20">and cloud architecture.</tspan>
      </text>
    </g>
    
    <!-- Member 3 -->
    <g transform="translate(600, 0)">
      <circle cx="150" cy="100" r="100" fill="#E2E8F0" />
      <text x="150" y="105" font-family="sans-serif" font-size="16" fill="#94A3B8" text-anchor="middle">PHOTO</text>
      
      <text x="150" y="240" font-family="sans-serif" font-size="24" font-weight="bold" fill="#0F172A" text-anchor="middle">Name Surname</text>
      <text x="150" y="270" font-family="sans-serif" font-size="18" fill="#3B82F6" text-anchor="middle">CMO</text>
      <text x="150" y="310" font-family="sans-serif" font-size="14" fill="#64748B" text-anchor="middle">
        <tspan x="150" dy="0">Driving growth and global</tspan>
        <tspan x="150" dy="20">brand marketing initiatives.</tspan>
      </text>
    </g>
  </g>
</svg>
