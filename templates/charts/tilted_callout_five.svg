<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1280" height="720" viewBox="0 0 1280 720">
<rect id="bg" width="1280" height="720" fill="#FFFFFF"/>
<!-- Page title -->
<text id="page-title" x="640" y="85" text-anchor="middle" font-family="'微软雅黑', Arial, sans-serif" font-size="30" fill="#232525" font-weight="bold">{{PAGE_TITLE}}</text>

<!-- ── Row 1: 3 circles + 3 tilted callout boxes ── -->

<!-- Circle 01 -->
<g id="node-1">
  <circle cx="328.58" cy="215.42" r="25.42" fill="#232525"/>
  <text x="328.58" y="222" text-anchor="middle" font-family="'Open Sans', Arial, sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold">01</text>
</g>
<!-- Connector: circle 01 bottom → box 1 top -->
<line id="conn-1" x1="328" y1="241" x2="324" y2="316" stroke="#232525" stroke-width="1.5"/>
<!-- Callout box 01 (rotated 9.81° around box center) -->
<g id="box-1" transform="rotate(9.81 323.65 366.17)">
  <rect x="221.98" y="315.5" width="203.33" height="101.33" rx="11.44" ry="11.44" fill="#232525"/>
  <text x="323.65" y="353" text-anchor="middle" font-family="'微软雅黑', Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="bold">{{BOX_TITLE_1}}</text>
  <text x="323.65" y="374" text-anchor="middle" font-family="'微软雅黑', Arial, sans-serif" font-size="11" fill="#AAAAAA">{{CONTENT_AREA_1}}</text>
</g>

