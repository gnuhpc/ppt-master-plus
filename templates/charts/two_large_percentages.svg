<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#0F172A" />
  <text x="640" y="120" font-family="sans-serif" font-size="36" font-weight="bold" fill="#FFFFFF" text-anchor="middle">{{PAGE_TITLE}}</text>
  
  <!-- Left Side -->
  <g transform="translate(320, 360)">
    <text x="0" y="-20" font-family="sans-serif" font-size="160" font-weight="bold" fill="#3B82F6" text-anchor="middle">23<tspan font-size="80">%</tspan></text>
    <line x1="-150" y1="20" x2="150" y2="20" stroke="#334155" stroke-width="2" />
    <text x="0" y="70" font-family="sans-serif" font-size="28" font-weight="bold" fill="#F8FAFC" text-anchor="middle">First Metric Title</text>
    <text x="0" y="110" font-family="sans-serif" font-size="16" fill="#94A3B8" text-anchor="middle">
      <tspan x="0" dy="0">Detailed description for the first metric.</tspan>
      <tspan x="0" dy="24">Provides context for the number.</tspan>
    </text>
  </g>
  
  <!-- Right Side -->
  <g transform="translate(960, 360)">
    <text x="0" y="-20" font-family="sans-serif" font-size="160" font-weight="bold" fill="#10B981" text-anchor="middle">10<tspan font-size="80">%</tspan></text>
    <line x1="-150" y1="20" x2="150" y2="20" stroke="#334155" stroke-width="2" />
    <text x="0" y="70" font-family="sans-serif" font-size="28" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Second Metric Title</text>
    <text x="0" y="110" font-family="sans-serif" font-size="16" fill="#94A3B8" text-anchor="middle">
      <tspan x="0" dy="0">Detailed description for the second metric.</tspan>
      <tspan x="0" dy="24">Provides context for the number.</tspan>
    </text>
  </g>
</svg>
