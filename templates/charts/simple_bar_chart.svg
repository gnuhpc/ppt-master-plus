<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F8FAFC" />
  <text x="640" y="100" font-family="sans-serif" font-size="36" font-weight="bold" fill="#1E293B" text-anchor="middle">{{PAGE_TITLE}}</text>
  
  <g transform="translate(300, 200)">
    <!-- Axes -->
    <line x1="0" y1="350" x2="680" y2="350" stroke="#94A3B8" stroke-width="2" />
    <line x1="0" y1="0" x2="0" y2="350" stroke="#94A3B8" stroke-width="2" />
    
    <!-- Grid Lines -->
    <line x1="0" y1="87.5" x2="680" y2="87.5" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="0" y1="175" x2="680" y2="175" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="0" y1="262.5" x2="680" y2="262.5" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,4" />
    
    <!-- Bars -->
    <!-- Bar 1: 40% -->
    <rect x="60" y="210" width="80" height="140" fill="#93C5FD" rx="4" ry="4" />
    <text x="100" y="195" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1E293B" text-anchor="middle">40</text>
    <text x="100" y="380" font-family="sans-serif" font-size="16" fill="#475569" text-anchor="middle">Category 1</text>
    
    <!-- Bar 2: 70% -->
    <rect x="220" y="105" width="80" height="245" fill="#60A5FA" rx="4" ry="4" />
    <text x="260" y="90" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1E293B" text-anchor="middle">70</text>
    <text x="260" y="380" font-family="sans-serif" font-size="16" fill="#475569" text-anchor="middle">Category 2</text>
    
    <!-- Bar 3: 100% -->
    <rect x="380" y="0" width="80" height="350" fill="#2563EB" rx="4" ry="4" />
    <text x="420" y="-15" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1E293B" text-anchor="middle">100</text>
    <text x="420" y="380" font-family="sans-serif" font-size="16" fill="#475569" text-anchor="middle">Category 3</text>
    
    <!-- Bar 4: 85% -->
    <rect x="540" y="52.5" width="80" height="297.5" fill="#1D4ED8" rx="4" ry="4" />
    <text x="580" y="37.5" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1E293B" text-anchor="middle">85</text>
    <text x="580" y="380" font-family="sans-serif" font-size="16" fill="#475569" text-anchor="middle">Category 4</text>
  </g>
</svg>
