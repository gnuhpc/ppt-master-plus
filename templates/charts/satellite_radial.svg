<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F8FAFC" />
  
  <!-- Orbiting circles (thin outline rings) -->
  <circle cx="480" cy="360" r="160" fill="none" stroke="#E2E8F0" stroke-width="4" />
  <circle cx="800" cy="360" r="160" fill="none" stroke="#E2E8F0" stroke-width="4" />
  
  <!-- Outer Satellite Nodes (6 items) -->
  <!-- Node 1: Left -->
  <g id="node-1">
    <circle cx="320" cy="360" r="70" fill="#0F172A" stroke="#FFFFFF" stroke-width="3" />
    <text x="320" y="355" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      <tspan>系统性与</tspan>
    </text>
    <text x="320" y="378" font-family="sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">
      <tspan>逻辑性原则</tspan>
    </text>
  </g>
  
  <!-- Node 2: Top-Left -->
  <g id="node-2">
    <circle cx="480" cy="200" r="70" fill="#0F172A" stroke="#FFFFFF" stroke-width="3" />
    <text x="480" y="195" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      <tspan>针对性与</tspan>
    </text>
    <text x="480" y="218" font-family="sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">
      <tspan>实用性原则</tspan>
    </text>
  </g>
  
  <!-- Node 3: Bottom-Left -->
  <g id="node-3">
    <circle cx="480" cy="520" r="70" fill="#0F172A" stroke="#FFFFFF" stroke-width="3" />
    <text x="480" y="515" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      <tspan>目标明确</tspan>
    </text>
    <text x="480" y="538" font-family="sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">
      <tspan>重点突出</tspan>
    </text>
  </g>
  
  <!-- Node 4: Right -->
  <g id="node-4">
    <circle cx="960" cy="360" r="70" fill="#0F172A" stroke="#FFFFFF" stroke-width="3" />
    <text x="960" y="355" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      <tspan>素材丰富</tspan>
    </text>
    <text x="960" y="378" font-family="sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">
      <tspan>生动形象</tspan>
    </text>
  </g>
  
  <!-- Node 5: Top-Right -->
  <g id="node-5">
    <circle cx="800" cy="200" r="70" fill="#0F172A" stroke="#FFFFFF" stroke-width="3" />
    <text x="800" y="195" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      <tspan>符合成人</tspan>
    </text>
    <text x="800" y="218" font-family="sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">
      <tspan>认知规律</tspan>
    </text>
  </g>
  
  <!-- Node 6: Bottom-Right -->
  <g id="node-6">
    <circle cx="800" cy="520" r="70" fill="#0F172A" stroke="#FFFFFF" stroke-width="3" />
    <text x="800" y="515" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      <tspan>内容精炼</tspan>
    </text>
    <text x="800" y="538" font-family="sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">
      <tspan>表达准确</tspan>
    </text>
  </g>
  
  <!-- Center Core Hub Badge (Bigger and Overlapping) -->
  <g id="core-hub">
    <circle cx="640" cy="360" r="100" fill="#3B82F6" stroke="#FFFFFF" stroke-width="5" />
    <text x="640" y="350" font-family="sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      <tspan>课程开发的</tspan>
    </text>
    <text x="640" y="385" font-family="sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      <tspan>核心原则</tspan>
    </text>
  </g>
</svg>
