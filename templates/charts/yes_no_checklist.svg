<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
  <text x="640" y="80" font-family="sans-serif" font-size="36" font-weight="bold" fill="#1E293B" text-anchor="middle">{{PAGE_TITLE}}</text>

  <g id="table" transform="translate(200, 130)">
    <!-- Header Row -->
    <rect x="0" y="0" width="640" height="55" fill="#1E293B" rx="4" />
    <rect x="660" y="0" width="220" height="55" fill="#1E293B" rx="4" />
    <text x="320" y="35" font-family="sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Requirements / Criteria</text>
    <text x="770" y="35" font-family="sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Applies?</text>

    <!-- Row 1 (light) -->
    <rect x="0" y="70" width="640" height="65" fill="#F8FAFC" />
    <rect x="660" y="70" width="220" height="65" fill="#F8FAFC" />
    <text x="30" y="110" font-family="sans-serif" font-size="18" fill="#334155">Initiated by internal department request</text>
    <circle cx="770" cy="102" r="12" fill="#10B981" />
    <text x="770" y="108" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Y</text>

    <!-- Row 2 (white) -->
    <rect x="0" y="135" width="640" height="65" fill="#FFFFFF" />
    <rect x="660" y="135" width="220" height="65" fill="#FFFFFF" />
    <text x="30" y="175" font-family="sans-serif" font-size="18" fill="#334155">Based on company business planning</text>
    <circle cx="770" cy="167" r="12" fill="#EF4444" />
    <text x="770" y="173" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">N</text>

    <!-- Row 3 (light) -->
    <rect x="0" y="200" width="640" height="65" fill="#F8FAFC" />
    <rect x="660" y="200" width="220" height="65" fill="#F8FAFC" />
    <text x="30" y="240" font-family="sans-serif" font-size="18" fill="#334155">Required by group headquarters directives</text>
    <circle cx="770" cy="232" r="12" fill="#10B981" />
    <text x="770" y="238" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Y</text>

    <!-- Row 4 (white) -->
    <rect x="0" y="265" width="640" height="65" fill="#FFFFFF" />
    <rect x="660" y="265" width="220" height="65" fill="#FFFFFF" />
    <text x="30" y="305" font-family="sans-serif" font-size="18" fill="#334155">Cross-department business requirement</text>
    <circle cx="770" cy="297" r="12" fill="#EF4444" />
    <text x="770" y="303" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">N</text>

    <!-- Row 5 (light) -->
    <rect x="0" y="330" width="640" height="65" fill="#F8FAFC" />
    <rect x="660" y="330" width="220" height="65" fill="#F8FAFC" />
    <text x="30" y="370" font-family="sans-serif" font-size="18" fill="#334155">Administrative management requirement</text>
    <circle cx="770" cy="362" r="12" fill="#10B981" />
    <text x="770" y="368" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Y</text>

    <!-- Border outline -->
    <rect x="0" y="0" width="880" height="395" fill="none" stroke="#E2E8F0" stroke-width="1" rx="4" />
  </g>
