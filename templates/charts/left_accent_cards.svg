<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Tech Dark Background -->
  <rect x="0" y="0" width="1280" height="720" fill="#0C1838" />
  
  <!-- Top-Right Accent Strips -->
  <rect x="1080" y="30" width="120" height="3" fill="#9967F7" />
  <rect x="1120" y="40" width="80" height="3" fill="#4EB5FF" />
  
  <!-- Slide Title -->
  <text x="80" y="70" font-family="sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF">{{PAGE_TITLE}}</text>
  <text x="80" y="105" font-family="sans-serif" font-size="16" fill="#4EB5FF">{{PAGE_SUBTITLE}}</text>

  <!-- 3 Labeled Cards with Left Color Strips -->
  <g transform="translate(80, 160)">
    <!-- Column 1 -->
    <g transform="translate(0, 0)">
      <!-- Card Panel -->
      <rect x="0" y="0" width="340" height="460" rx="10" ry="10" fill="#151C48" stroke="#3C4778" stroke-width="1" />
      <!-- Left color bar -->
      <rect x="0" y="0" width="9" height="460" rx="2" ry="2" fill="#04CF82" />
      
      <!-- Text details -->
      <text x="30" y="50" font-family="sans-serif" font-size="16" font-weight="bold" fill="#04CF82">{{CARD_1_TAG}}</text>
      <text x="30" y="90" font-family="sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">{{CARD_1_TITLE}}</text>
      <text x="30" y="130" font-family="sans-serif" font-size="14" fill="#DCD7E5">{{CARD_1_SUBTITLE}}</text>
      
      <line x1="30" y1="160" x2="310" y2="160" stroke="#3C4778" stroke-width="1" />
      
      <g transform="translate(30, 190)" font-family="sans-serif" font-size="15" fill="#DCD7E5">
        <text x="0" y="20">{{CARD_1_BULLET_1}}</text>
        <text x="0" y="60">{{CARD_1_BULLET_2}}</text>
        <text x="0" y="100">{{CARD_1_BULLET_3}}</text>
        <text x="0" y="140">{{CARD_1_BULLET_4}}</text>
        <text x="0" y="180">{{CARD_1_BULLET_5}}</text>
        <text x="0" y="220">{{CARD_1_BULLET_6}}</text>
      </g>
    </g>

    <!-- Column 2 -->
    <g transform="translate(390, 0)">
      <!-- Card Panel -->
      <rect x="0" y="0" width="340" height="460" rx="10" ry="10" fill="#151C48" stroke="#3C4778" stroke-width="1" />
      <!-- Left color bar -->
      <rect x="0" y="0" width="9" height="460" rx="2" ry="2" fill="#9967F7" />
      
      <!-- Text details -->
      <text x="30" y="50" font-family="sans-serif" font-size="16" font-weight="bold" fill="#9967F7">{{CARD_2_TAG}}</text>
      <text x="30" y="90" font-family="sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">{{CARD_2_TITLE}}</text>
      <text x="30" y="130" font-family="sans-serif" font-size="14" fill="#DCD7E5">{{CARD_2_SUBTITLE}}</text>
      
      <line x1="30" y1="160" x2="310" y2="160" stroke="#3C4778" stroke-width="1" />
      
      <g transform="translate(30, 190)" font-family="sans-serif" font-size="15" fill="#DCD7E5">
        <text x="0" y="20">{{CARD_2_BULLET_1}}</text>
        <text x="0" y="60">{{CARD_2_BULLET_2}}</text>
        <text x="0" y="100">{{CARD_2_BULLET_3}}</text>
        <text x="0" y="140">{{CARD_2_BULLET_4}}</text>
        <text x="0" y="180">{{CARD_2_BULLET_5}}</text>
        <text x="0" y="220">{{CARD_2_BULLET_6}}</text>
      </g>
    </g>

    <!-- Column 3 -->
    <g transform="translate(780, 0)">
      <!-- Card Panel -->
      <rect x="0" y="0" width="340" height="460" rx="10" ry="10" fill="#151C48" stroke="#3C4778" stroke-width="1" />
      <!-- Left color bar -->
      <rect x="0" y="0" width="9" height="460" rx="2" ry="2" fill="#4EB5FF" />
      
      <!-- Text details -->
      <text x="30" y="50" font-family="sans-serif" font-size="16" font-weight="bold" fill="#4EB5FF">{{CARD_3_TAG}}</text>
      <text x="30" y="90" font-family="sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">{{CARD_3_TITLE}}</text>
      <text x="30" y="130" font-family="sans-serif" font-size="14" fill="#DCD7E5">{{CARD_3_SUBTITLE}}</text>
      
      <line x1="30" y1="160" x2="310" y2="160" stroke="#3C4778" stroke-width="1" />
      
      <g transform="translate(30, 190)" font-family="sans-serif" font-size="15" fill="#DCD7E5">
        <text x="0" y="20">{{CARD_3_BULLET_1}}</text>
        <text x="0" y="60">{{CARD_3_BULLET_2}}</text>
        <text x="0" y="100">{{CARD_3_BULLET_3}}</text>
        <text x="0" y="140">{{CARD_3_BULLET_4}}</text>
        <text x="0" y="180">{{CARD_3_BULLET_5}}</text>
        <text x="0" y="220">{{CARD_3_BULLET_6}}</text>
      </g>
    </g>
  </g>
</svg>
