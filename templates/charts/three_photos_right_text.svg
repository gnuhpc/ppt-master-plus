<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  <!-- Three Photo Slots (vertical arrangement) -->
  <rect x="60" y="90" width="190" height="540" fill="#F1F5F9" rx="4" />
  <text x="155" y="360" font-family="sans-serif" font-size="16" fill="#94A3B8" text-anchor="middle">PHOTO 1</text>

  <rect x="270" y="90" width="190" height="540" fill="#E2E8F0" rx="4" />
  <text x="365" y="360" font-family="sans-serif" font-size="16" fill="#94A3B8" text-anchor="middle">PHOTO 2</text>

  <rect x="480" y="90" width="190" height="540" fill="#F1F5F9" rx="4" />
  <text x="575" y="360" font-family="sans-serif" font-size="16" fill="#94A3B8" text-anchor="middle">PHOTO 3</text>

  <!-- Right panel border -->
  <rect x="720" y="90" width="500" height="540" fill="none" stroke="#E2E8F0" stroke-width="1" rx="4" />

  <!-- Page Title -->
  <text x="970" y="150" font-family="sans-serif" font-size="28" font-weight="bold" fill="#1E293B" text-anchor="middle">{{PAGE_TITLE}}</text>
  <line x1="780" y1="170" x2="1160" y2="170" stroke="#E2E8F0" stroke-width="1" />

  <!-- 3 Text Items -->
  <g id="item1" transform="translate(750, 220)">
    <text x="0" y="0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1E293B">Point Title 1</text>
    <text x="0" y="35" font-family="sans-serif" font-size="15" fill="#64748B">
      <tspan x="0" dy="0">Supporting text for point one goes here.</tspan>
      <tspan x="0" dy="22">Explain it briefly in one or two sentences.</tspan>
    </text>
  </g>

  <g id="item2" transform="translate(750, 390)">
    <text x="0" y="0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1E293B">Point Title 2</text>
    <text x="0" y="35" font-family="sans-serif" font-size="15" fill="#64748B">
      <tspan x="0" dy="0">Supporting text for point two goes here.</tspan>
      <tspan x="0" dy="22">Explain it briefly in one or two sentences.</tspan>
    </text>
  </g>

  <g id="item3" transform="translate(750, 530)">
    <text x="0" y="0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1E293B">Point Title 3</text>
    <text x="0" y="35" font-family="sans-serif" font-size="15" fill="#64748B">
      <tspan x="0" dy="0">Supporting text for point three.</tspan>
    </text>
  </g>
</svg>
