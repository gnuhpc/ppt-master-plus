    <text x="0" y="-8" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1E293B" text-anchor="middle">2</text>
    <text x="0" y="16" font-family="sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Point</text>
    <text x="0" y="70" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1E293B" text-anchor="middle">Node Title 2</text>
    <text x="0" y="95" font-family="sans-serif" font-size="13" fill="#64748B" text-anchor="middle">Brief description here.</text>
  </g>

  <!-- Node 3: Bottom Left -->
  <g transform="translate(210, 560)">
    <circle cx="0" cy="0" r="50" fill="#FFFFFF" stroke="#1E293B" stroke-width="3" />
    <text x="0" y="-8" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1E293B" text-anchor="middle">4</text>
    <text x="0" y="16" font-family="sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Point</text>
    <text x="0" y="-65" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1E293B" text-anchor="middle">Node Title 4</text>
    <text x="0" y="-40" font-family="sans-serif" font-size="13" fill="#64748B" text-anchor="middle">Brief description here.</text>
