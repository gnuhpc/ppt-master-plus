    <text x="0" y="-8" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1E293B" text-anchor="middle">1</text>
    <text x="0" y="16" font-family="sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Point</text>
    <text x="0" y="70" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1E293B" text-anchor="middle">Node Title 1</text>
    <text x="0" y="95" font-family="sans-serif" font-size="13" fill="#64748B" text-anchor="middle">Brief description here.</text>
  </g>

  <!-- Node 2: Top Right -->
