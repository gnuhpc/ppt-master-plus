<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
  <text x="640" y="80" font-family="sans-serif" font-size="36" font-weight="bold" fill="#1E293B" text-anchor="middle">{{PAGE_TITLE}}</text>

  <!-- Central Word/Icon -->
  <circle cx="640" cy="390" r="80" fill="#1E293B" />
  <text x="640" y="380" font-family="sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle">CORE</text>
  <text x="640" y="408" font-family="sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">CONCEPT</text>

  <!-- Connector lines to 4 corners -->
  <line x1="570" y1="330" x2="400" y2="230" stroke="#E2E8F0" stroke-width="1" />
  <line x1="710" y1="330" x2="880" y2="230" stroke="#E2E8F0" stroke-width="1" />
  <line x1="570" y1="450" x2="400" y2="560" stroke="#E2E8F0" stroke-width="1" />
