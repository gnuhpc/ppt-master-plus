      <text x="0" y="8" font-family="sans-serif" font-size="20" font-weight="bold" fill="#3B82F6" text-anchor="middle">4</text>
      <text x="0" y="60" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1E293B" text-anchor="middle">Step 4</text>
