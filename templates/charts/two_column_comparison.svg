<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F8FAFC" />
  <text x="640" y="100" font-family="sans-serif" font-size="36" font-weight="bold" fill="#1E293B" text-anchor="middle">{{PAGE_TITLE}}</text>
  
  <g transform="translate(140, 200)">
    <!-- Option A -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="480" height="360" rx="16" ry="16" fill="#FFFFFF" stroke="#3B82F6" stroke-width="3" />
      <text x="240" y="60" font-family="sans-serif" font-size="28" font-weight="bold" fill="#3B82F6" text-anchor="middle">Option A</text>
      <line x1="40" y1="90" x2="440" y2="90" stroke="#E2E8F0" stroke-width="1" />
      
      <circle cx="60" cy="140" r="8" fill="#3B82F6" />
      <text x="90" y="146" font-family="sans-serif" font-size="18" fill="#334155">Feature one description</text>
      
      <circle cx="60" cy="200" r="8" fill="#3B82F6" />
      <text x="90" y="206" font-family="sans-serif" font-size="18" fill="#334155">Feature two description</text>
      
      <circle cx="60" cy="260" r="8" fill="#3B82F6" />
      <text x="90" y="266" font-family="sans-serif" font-size="18" fill="#334155">Feature three description</text>
    </g>
    
    <!-- Option B -->
    <g transform="translate(520, 0)">
      <rect x="0" y="0" width="480" height="360" rx="16" ry="16" fill="#FFFFFF" stroke="#10B981" stroke-width="3" />
      <text x="240" y="60" font-family="sans-serif" font-size="28" font-weight="bold" fill="#10B981" text-anchor="middle">Option B</text>
      <line x1="40" y1="90" x2="440" y2="90" stroke="#E2E8F0" stroke-width="1" />
      
      <circle cx="60" cy="140" r="8" fill="#10B981" />
      <text x="90" y="146" font-family="sans-serif" font-size="18" fill="#334155">Alternative feature one</text>
      
      <circle cx="60" cy="200" r="8" fill="#10B981" />
      <text x="90" y="206" font-family="sans-serif" font-size="18" fill="#334155">Alternative feature two</text>
      
      <circle cx="60" cy="260" r="8" fill="#10B981" />
      <text x="90" y="266" font-family="sans-serif" font-size="18" fill="#334155">Alternative feature three</text>
    </g>
  </g>
</svg>
